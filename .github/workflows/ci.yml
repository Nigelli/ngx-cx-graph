name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library (cx-graph)
        run: npm run build:lib

      - name: Build demo apps
        run: npm run build:demo

      # GitHub-hosted ubuntu runners ship Google Chrome, which
      # karma-chrome-launcher's ChromeHeadless launcher finds by itself.
      - name: Run library unit tests (ChromeHeadless)
        run: npm run test:ci

  audit:
    name: npm audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking: advisories in the dev toolchain should be visible
      # without gating merges.
      - name: Audit production dependencies
        run: npm audit --omit=dev
        continue-on-error: true
