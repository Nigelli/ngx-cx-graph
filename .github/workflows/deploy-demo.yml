name: Deploy demo

# Builds the three demo apps and publishes them to GitHub Pages at
# https://nigelli.github.io/ngx-cx-graph/ on every push to main.
#
# One-time setup by a maintainer: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel superseded in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Each app gets its own sub-path, so base-href must match it. The demos
      # compile the library from source, so they always reflect latest main.
      - name: Build demos (production)
        run: |
          for app in nebular material primeng; do
            npx ng build "demo-$app" --base-href="/ngx-cx-graph/$app/"
          done

      - name: Assemble site
        run: |
          mkdir -p site
          cp pages/index.html site/index.html
          touch site/.nojekyll
          for app in nebular material primeng; do
            cp -r "dist/demo-$app/browser" "site/$app"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
