name: Release

# Publishes the ngx-cx-graph library to npm whenever a tag matching `v*`
# (e.g. v0.1.0) is pushed.
#
# Auth is npm Trusted Publishing (OIDC). It must be configured on the npm
# side first (package -> Settings -> Trusted Publisher) and must match this
# repo AND this workflow's filename (release.yml). Until then a tag push
# fails at the publish step.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 is needed for the OIDC exchange.
      - name: Upgrade npm (Trusted Publishing / OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build library (production)
        run: npm run build:lib

      - name: Publish to npm (Trusted Publishing + provenance)
        run: npm publish --provenance --access public
        working-directory: dist/cx-graph
